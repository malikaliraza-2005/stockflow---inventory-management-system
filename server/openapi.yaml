# IMS REST API — contract-first stub (Phase 0, task 0.5 · NFR-27 · R-7).
#
# Distilled from 05-REST-API-Specification.md (APPROVED). This file is the
# SOURCE the client types are generated from (client: npm run generate:types);
# CI fails if client/src/types drifts from it (openapi-drift gate).
#
# Growth rule: each feature's T-e task (IMP-020 §1) adds its §7 endpoints here,
# regenerates types, and commits both. Nothing is added ahead of its feature.
openapi: 3.1.0

info:
  title: IMS REST API
  version: 1.0.0
  description: >-
    Web-Based Inventory Management System API. Contract per REST-API
    Specification 05 (approved): additive evolution only within v1; clients
    MUST tolerate unknown response fields. All routes relative to /api/v1
    except GET /health and GET /ready (server root, ahead of limiters/auth).

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: system
    description: Health endpoints — server root, public, unlimited (05 §7.11)
  - name: auth
    description: Authentication & sessions — 05 §7.1 (F1). Refresh token travels only as an httpOnly cookie scoped to /api/v1/auth.
  - name: users
    description: User management — 05 §7.2 (F2). Admin-only except /users/me. No delete path exists (BR-29).
  - name: categories
    description: Category taxonomy — 05 §7.4 (F3). Reads both-roles; writes Admin. Flat, case-insensitive unique names (BR-26); the system category Uncategorized is undeletable (BR-28).
  - name: products
    description: Product catalog + materialized stock — 05 §7.3 (F4). Reads both-roles; catalog writes and lifecycle Admin. quantity is MovementService-only (BR-17); the invariant quantity == Σ ledger holds from creation via the INITIAL row.
  - name: movements
    description: Stock movements & the ledger — 05 §7.5 (F6), the change-controlled core. POST /inventory/movements is the sole over-the-wire quantity writer (Boundary T1); idempotent via the Idempotency-Key header (ARB-02). STOCK_IN/STOCK_OUT both-roles; ADJUSTMENT Admin (the one validate-before-authorize route, AAD §5.2).
  - name: transactions
    description: Stock ledger reads — 05 §7.6 (F7). The append-only ledger; both-roles read. No write path exists (DES-1) — MovementService is the only writer. Filterable by date/type/product/user; archived-product rows are hidden unless requested (EC-16 badge).
  - name: audit
    description: Audit trail reads — 05 §7.6 (F7). Admin-only; append-only (DES-1). Entity diffs + security events; entityLabel (DN-4) survives hard deletes. Filterable by entity type / entity / actor / date.
  - name: dashboard
    description: The single cached dashboard aggregate — 05 §7.7 (F9). Both-roles read. Every metric and both chart series come from one call (FR-DASH-03), served from a 30–60 s per-instance cache; asOf surfaces the snapshot age (BR-25).
  - name: reports
    description: Reports & export — 05 §7.8 (F10). Five paginated on-screen reports (both-roles; consistency Admin) plus an Admin-only CSV export streaming the full filtered dataset (ERR §7). Historical reports are ledger-derived and byte-reproducible (BR-40); snapshot reports value stock at current cost (AS-17).
  - name: settings
    description: System settings singleton — 05 §7.10 (F11). Admin-only; Staff reads the same display constants from the session payload (FCM-01). defaultLowStockThreshold is copied into products at creation (DN-3) — edits never rewrite existing products.
  - name: uploads
    description: Cloudinary signed uploads — 05 §7.9 (F5). Admin-only. The server signs an upload scoped to ims/prod; the browser uploads directly (SEC-08). Destroy is folder-scoped (APR-03). Images are attached via the product body, not here.

paths:
  /health:
    servers:
      - url: /
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness — process up (NFR-14, ARB-04)
      security: []
      responses:
        '200':
          description: Process is up. No auth, no rate limit, no business data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /ready:
    servers:
      - url: /
    get:
      tags: [system]
      operationId: getReady
      summary: Readiness — includes DB connectivity (NFR-15)
      description: >-
        Deploy gates and load-balancer checks target this endpoint. False
        during boot (before Mongo connect + integrity check) and after SIGTERM
        (drain) per BEA §8.
      security: []
      responses:
        '200':
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyStatus'
        '503':
          description: Not ready (DB down / booting / draining). Carries Retry-After (NFR-20).
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Authenticate; set refresh cookie; return access token + profile (FR-AUTH-01/04, UC-01)
      description: >-
        Failure counter and lockout per BR-33; success resets the counter,
        stamps lastLoginAt, records a security event. Errors stay generic —
        the password policy is never revealed on this route (AAD §2).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: >-
            Session established. Also sets the rotating refresh cookie
            (httpOnly · Secure · SameSite=Strict · Path=/api/v1/auth).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Bad credentials (generic — UNAUTHORIZED) or ACCOUNT_DEACTIVATED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '423':
          description: ACCOUNT_LOCKED — 5 consecutive failures → 15-min lock (BR-33).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the refresh token; issue a new access token (FR-AUTH-02/06)
      description: >-
        Cookie-authenticated (no body). Reuse of a rotated token revokes the
        entire session family and records a security event (BR-35). Clients
        single-flight this call (ARB-03).
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Rotated session + new refresh Set-Cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: Missing/expired/revoked/reused token (UNAUTHORIZED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current refresh token; clear the cookie (FR-AUTH-03)
      description: Idempotent — revoking an already-revoked/unknown token still succeeds.
      responses:
        '204':
          description: Session revoked; expired Set-Cookie returned.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Complete an Admin-initiated reset (FR-AUTH-05, UC-03)
      description: >-
        Token is single-use, 30-min expiry, hashed at rest; success revokes
        all prior sessions and clears mustChangePassword.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password installed; all prior sessions revoked.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Invalid/expired/used token (UNAUTHORIZED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/change-password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change own password (FR-USER-05)
      description: >-
        Current password required and verified; revokes all OTHER sessions.
        One of the three calls a mustChangePassword session may make (AAD §2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed; other sessions revoked.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Wrong current password, or missing/invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users (FR-USER-02, §9.12) — Admin
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/Role'
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          description: Name/email partial match, ≤ 120 chars.
          schema:
            type: string
            maxLength: 120
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, email, createdAt, lastLoginAt]
            default: createdAt
        - $ref: '#/components/parameters/order'
      responses:
        '200':
          description: List envelope of user rows.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [users]
      operationId: createUser
      summary: Provision a user with a temporary password (FR-USER-01, BR-31) — Admin
      description: Created accounts carry mustChangePassword=true. Self-registration does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Created user (no credential fields, SEC-02).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: DUPLICATE_EMAIL — SRS §12.2 mandated 409, unique-index-backed (race-safe).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /users/me:
    get:
      tags: [users]
      operationId: getOwnProfile
      summary: Own profile (§9.14) — Any
      responses:
        '200':
          description: Own profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [users]
      operationId: updateOwnProfile
      summary: Update own name — Any. Role/status/email changes are not possible on this route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 80
      responses:
        '200':
          description: Updated profile (change audited).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
    get:
      tags: [users]
      operationId: getUser
      summary: Single user — Admin
      responses:
        '200':
          description: User (no credential fields).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [users]
      operationId: updateUser
      summary: Update name/role/isActive (FR-USER-02/03/04) — Admin
      description: >-
        Boundary T6 — atomic active-admin count + change + session revocation
        + audit entry in one transaction (BR-30). Demotion/deactivation
        revokes all target sessions immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: LAST_ADMIN — the last active Admin is unviolable (BR-30).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /users/{id}/reset-password:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
    post:
      tags: [users]
      operationId: issueResetLink
      summary: Issue a single-use reset link (FR-AUTH-05, UC-03) — Admin
      description: >-
        Revokes the target's sessions at issue; returns the link for
        out-of-band delivery (AS-6). Token is hashed at rest, 30-min expiry.
      responses:
        '200':
          description: Reset link + expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetLinkResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /categories:
    get:
      tags: [categories]
      operationId: listCategories
      summary: List categories (FR-CAT-03, §7.4) — Any
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: withCounts
          in: query
          description: When true, each row carries productCount (active + archived) — §9.9.
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, createdAt]
            default: name
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: List envelope of category rows.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [categories]
      operationId: createCategory
      summary: Create a category (FR-CAT-01, BR-26) — Admin
      description: >-
        Name is unique case-insensitive via the collation index. A duplicate —
        including a concurrent-create race — maps to VALIDATION_ERROR, NOT a 409
        (APR-08: no SRS §16.3 409 mandate exists for category names).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryWriteRequest'
      responses:
        '201':
          description: Created category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
    get:
      tags: [categories]
      operationId: getCategory
      summary: Single category — Any
      responses:
        '200':
          description: Category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [categories]
      operationId: updateCategory
      summary: Update name/description (FR-CAT-01, BR-26) — Admin
      description: >-
        Replaces name + description (an omitted description unsets). The system
        category is unmodifiable (BR-28) — the attempt returns VALIDATION_ERROR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryWriteRequest'
      responses:
        '200':
          description: Updated category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [categories]
      operationId: deleteCategory
      summary: Delete a category, optionally reassigning its products (FR-CAT-02, BR-27/28) — Admin
      description: >-
        Boundary T5 — assert/reassign references + delete + audit, one atomic
        transaction. Blocked while any product (active OR archived) references
        it and no reassignment target is supplied → 409 CATEGORY_IN_USE. The
        system category is undeletable → VALIDATION_ERROR.
      parameters:
        - name: reassignTo
          in: query
          required: false
          description: >-
            Target category id for bulk reassignment before delete (default UI
            target: Uncategorized). Identical-to-self or non-existent →
            VALIDATION_ERROR.
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '204':
          description: Deleted (and reassigned, if requested). No body.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: CATEGORY_IN_USE — products still reference it; reassign first (BR-27).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /products:
    get:
      tags: [products]
      operationId: listProducts
      summary: List products (FR-PROD-05, §7.3) — Any
      description: >-
        Row projections (no image arrays, NFR-05). `archived` is an Admin-only
        filter (APD-02) — a Staff request carrying it is 403; omitted ⇒ active
        only.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: search
          in: query
          description: Name / SKU / barcode partial match, ≤ 120 chars.
          schema:
            type: string
            maxLength: 120
        - name: categoryId
          in: query
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
        - name: stockStatus
          in: query
          schema:
            type: string
            enum: [in, low, out]
        - name: archived
          in: query
          description: Admin-only — filter by archival state. Staff supplying it → 403.
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, sku, quantity, createdAt, costPrice]
            default: createdAt
        - $ref: '#/components/parameters/order'
      responses:
        '200':
          description: List envelope of product row projections.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProductRow'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [products]
      operationId: createProduct
      summary: Create a product (FR-PROD-01, BR-01…10) — Admin
      description: >-
        Boundary T2 — insert product + (non-zero initial stock) an INITIAL
        ledger row, one atomic transaction, so quantity == Σ ledger from
        creation. Blank SKU auto-generates from the category prefix (BR-04).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Created product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: DUPLICATE_SKU or DUPLICATE_BARCODE — unique-index-backed, race-safe (BR-01/05).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /products/lookup:
    get:
      tags: [products]
      operationId: lookupProduct
      summary: Look up a product by barcode then SKU (BR-06/07) — Any
      description: >-
        Barcode (primary) then SKU (fallback). An archived product is reported
        AS archived, never as not-found (BR-07). A malformed payload is 422
        INVALID_BARCODE (BR-16), not a 400.
      parameters:
        - name: code
          in: query
          required: true
          description: Scanned/typed code — printable, ≤ 64 chars (BR-16).
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        '200':
          description: The matched product (scanner-facing shape).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductLookup'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: INVALID_BARCODE — the payload is not a usable code (BR-16).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
    get:
      tags: [products]
      operationId: getProduct
      summary: Single product — Any
      responses:
        '200':
          description: Full product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [products]
      operationId: updateProduct
      summary: Update catalog fields with optimistic concurrency (BR-24) — Admin
      description: >-
        Carries `version`; a mismatch is 409 STALE_WRITE. SKU is immutable
        (BR-03) and quantity is MovementService-only (BR-17) — neither is
        accepted here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: Updated product (version incremented).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: STALE_WRITE (version mismatch) or DUPLICATE_BARCODE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags: [products]
      operationId: deleteProduct
      summary: Hard delete a product with zero ledger history (BR-23) — Admin
      description: >-
        Boundary T4 — assert zero transactions + delete + audit, atomic. Any
        product with stock history (an INITIAL row or movements) can only be
        archived → 409 PRODUCT_HAS_HISTORY.
      responses:
        '204':
          description: Deleted. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: PRODUCT_HAS_HISTORY — the product has ledger rows; archive instead (BR-23).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /products/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
    post:
      tags: [products]
      operationId: archiveProduct
      summary: Archive a product (requires zero stock, BR-22) — Admin
      description: >-
        Boundary T3 — the quantity == 0 predicate is checked inside the write
        (a concurrent movement aborts one op).
      responses:
        '200':
          description: Archived product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: PRODUCT_NOT_EMPTY (quantity ≠ 0) or PRODUCT_ARCHIVED (already archived).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /products/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
    post:
      tags: [products]
      operationId: restoreProduct
      summary: Restore an archived product (FR-PROD-04) — Admin
      responses:
        '200':
          description: Restored product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: The product is not archived (VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /inventory/movements:
    post:
      tags: [movements]
      operationId: recordMovement
      summary: Record a stock movement (BR-11…20) — Any (STOCK_IN/OUT) · Admin (ADJUSTMENT)
      description: >-
        The load-bearing ledger endpoint (ARC §3.2). Executes Boundary T1 —
        conditional findOneAndUpdate (isArchived:false; quantity ≥ requested for
        negatives) + Transaction insert, one majority transaction (A-1), with
        bounded transient-conflict retry. The Idempotency-Key header is required
        (05 §4): a replay with the identical payload returns the original outcome
        (A-4), the same key with a different payload is 422 IDEMPOTENCY_CONFLICT.
        The ONE validate-before-authorize route (AAD §5.2) — a Staff-submitted
        ADJUSTMENT is 403.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: RFC-4122 UUID, any version (APR-07). Missing/malformed → 400.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementRequest'
      responses:
        '200':
          description: The committed (or replayed) movement + resulting product state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: INSUFFICIENT_STOCK (details {available, requested}) or PRODUCT_ARCHIVED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: IDEMPOTENCY_CONFLICT — same key, different payload (BR-20).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /transactions:
    get:
      tags: [transactions]
      operationId: listTransactions
      summary: List the stock ledger (FR-TXN-01…03) — Any
      description: >-
        The append-only Stock Ledger (F7 tab). Rows carry product + user display
        labels; an archived-product row sets productArchived (EC-16 badge) and is
        hidden unless includeArchived=true — or a specific productId is filtered
        (explicit intent wins). Paginated (05 §5 envelope), createdAt-desc.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: from
          in: query
          description: Inclusive start (ISO-8601 date or datetime).
          schema:
            type: string
        - name: to
          in: query
          description: Inclusive end (a date-only value covers its whole UTC day).
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [INITIAL, STOCK_IN, STOCK_OUT, ADJUSTMENT]
        - name: productId
          in: query
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
        - name: userId
          in: query
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
        - name: includeArchived
          in: query
          description: Include rows whose product is archived (default false).
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List envelope of ledger rows.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TransactionRow'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /audit-logs:
    get:
      tags: [audit]
      operationId: listAuditLogs
      summary: List the audit trail (FR-TXN-04/05) — Admin
      description: >-
        Paginated audit trail — entity diffs + security events. entityLabel (DN-4)
        renders entries after hard deletes. Append-only; no mutation route exists
        (DES-1). Filterable by entity type / entity / actor / ordered date range.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: entityType
          in: query
          schema:
            type: string
            enum: [PRODUCT, CATEGORY, USER, SETTINGS, SECURITY]
        - name: entityId
          in: query
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
        - name: actorId
          in: query
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List envelope of audit rows.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditLogRow'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /dashboard/summary:
    get:
      tags: [dashboard]
      operationId: getDashboardSummary
      summary: The single cached dashboard aggregate (FR-DASH-01…04) — Any
      description: >-
        Every dashboard metric and both chart series in ONE call (FR-DASH-03),
        served from a per-instance cache (30–60 s TTL, A-2). `asOf` reports when
        the served snapshot was computed — under a cache hit it can lag by up to
        one TTL, the stated staleness bound (BR-25). Totals exclude archived
        products; recent rows and chart series span all products.
      parameters:
        - name: range
          in: query
          description: Chart/trend window in days (FR-DASH-02). Default 30.
          schema:
            type: integer
            enum: [7, 30, 90]
            default: 30
      responses:
        '200':
          description: The dashboard summary snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/inventory:
    get:
      tags: [reports]
      operationId: getInventoryReport
      summary: Inventory Summary report (FR-RPT-01) — Any
      description: >-
        Per active product: SKU, name, category, quantity, current cost, and line
        value (cost × quantity), with a totals row. Filter by category and derived
        stock status. Values use CURRENT cost (AS-17).
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: categoryId
          in: query
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
        - name: stockStatus
          in: query
          schema:
            $ref: '#/components/schemas/StockStatus'
      responses:
        '200':
          description: Inventory rows + totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryReport'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/low-stock:
    get:
      tags: [reports]
      operationId: getLowStockReport
      summary: Low Stock report (FR-RPT-02) — Any
      description: Active products at or below their threshold, with threshold, quantity, and shortage.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Low-stock rows.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/LowStockReportRow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/transactions:
    get:
      tags: [reports]
      operationId: getTransactionsReport
      summary: Transaction History report (FR-RPT-03, BR-40) — Any
      description: >-
        Ledger-derived movements over a MANDATORY date range (both bounds
        required, span ≤ 366 days). Re-running a past period is byte-identical
        (BR-40). Rows are the ledger row shape.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [INITIAL, STOCK_IN, STOCK_OUT, ADJUSTMENT]
        - name: productId
          in: query
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
        - name: userId
          in: query
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: Ledger rows over the range.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TransactionRow'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/product-performance:
    get:
      tags: [reports]
      operationId: getProductPerformanceReport
      summary: Product Performance report (FR-RPT-04) — Any
      description: >-
        Per-product in/out/net movement totals over a MANDATORY date range (span
        ≤ 366 days), ledger-derived (BR-40), with an overall totals row.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Per-product performance rows + totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPerformanceReport'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/consistency:
    get:
      tags: [reports]
      operationId: getConsistencyReport
      summary: Ledger Consistency report (FR-RPT-05, BR-18) — Admin
      description: >-
        Per-product reconciliation: ledger sum (Σ quantityChange) vs the
        materialized quantity, drift flagged. Snapshot-consistent (ARB-05).
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Consistency rows.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ConsistencyRow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/{name}/export:
    get:
      tags: [reports]
      operationId: exportReport
      summary: Stream a report as CSV (FR-RPT-06) — Admin
      description: >-
        Streams `text/csv` of the FULL filtered dataset for the named report
        (page/limit ignored, APR-06). Admin-only — Staff receive 403 at the API.
        Same filters as the named report. The stream writes rows only after a
        successful first batch; a mid-stream failure destroys the connection
        rather than emitting a truncated-but-complete-looking file (ERR §7).
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum: [inventory, low-stock, transactions, product-performance, consistency]
      responses:
        '200':
          description: CSV stream of the full filtered dataset.
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Read the settings singleton (BR-41) — Admin
      description: Admin-only; Staff reads these constants from the session payload (FCM-01), never here.
      responses:
        '200':
          description: The settings singleton.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [settings]
      operationId: updateSettings
      summary: Update the settings singleton (BR-41, audited) — Admin
      description: >-
        Full-object replace of the singleton, in place. defaultLowStockThreshold
        changes apply to NEW products only (DN-3) — existing products keep their
        copied value. Changes are audited (entityType SETTINGS).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdateRequest'
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /upload/signature:
    post:
      tags: [uploads]
      operationId: createUploadSignature
      summary: Sign a Cloudinary upload scoped to ims/prod (SEC-08, BR-36) — Admin
      description: >-
        Returns signed params; the browser uploads directly to Cloudinary — image
        bytes never transit this API. Type/size are validated before signing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadSignatureRequest'
      responses:
        '200':
          description: Signed upload parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSignatureResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /upload/{publicId}:
    delete:
      tags: [uploads]
      operationId: destroyUpload
      summary: Destroy an uploaded asset (BR-38) — Admin
      description: >-
        The publicId contains `/` and MUST be percent-encoded. Folder-scoped
        (APR-03): a publicId outside the app's ims/prod folder is 403 and can
        never be destroyed here.
      parameters:
        - name: publicId
          in: path
          required: true
          description: Percent-encoded Cloudinary publicId (e.g. ims%2Fprod%2Fabc123).
          schema:
            type: string
      responses:
        '204':
          description: Destroyed. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: FORBIDDEN — the publicId is outside the app's upload folder (APR-03).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken
      description: >-
        Rotating refresh session — httpOnly · Secure · SameSite=Strict,
        scoped to /api/v1/auth (AAD §3.2). Never appears in bodies or headers.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access token — 15-min TTL, payload sub/role/iat/exp only (SEC-01).
        The rotating refresh token travels exclusively as an httpOnly cookie
        scoped to /api/v1/auth and never appears in this contract's bodies.

  headers:
    XCorrelationId:
      description: Correlation ID echoed on every response (NFR-23, 05 §1).
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying (NFR-20).
      schema:
        type: integer
        minimum: 0

  parameters:
    page:
      name: page
      in: query
      description: 1-based page number (05 §5).
      schema:
        type: integer
        minimum: 1
        default: 1
    limit:
      name: limit
      in: query
      description: Page size — hard cap 100; values above cap → VALIDATION_ERROR (NFR-10).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    sort:
      name: sort
      in: query
      description: Sort field — sortable fields enumerated per endpoint; unknown → VALIDATION_ERROR.
      schema:
        type: string
    order:
      name: order
      in: query
      description: Sort direction companion to sort (APD-01). Default desc.
      schema:
        type: string
        enum: [asc, desc]
        default: desc

  responses:
    ValidationError:
      description: Request failed schema validation before the controller ran (05 §1).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing/invalid token, or account deactivated (UNAUTHORIZED | ACCOUNT_DEACTIVATED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Role insufficient per the §5 permission matrix (FORBIDDEN).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found (NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Rate limit exceeded (RATE_LIMITED, SEC-04).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Opaque internal error — correlation ID only, no internals (SEC-12).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: DB down / not ready; carries Retry-After (NFR-20).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    ErrorCode:
      type: string
      description: >-
        The CLOSED set of codes this API may emit — SRS §16.3 catalog plus the
        three documented APR-01 extensions (DUPLICATE_EMAIL, PRODUCT_NOT_EMPTY,
        PRODUCT_HAS_HISTORY). 05 §6.2.
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - ACCOUNT_DEACTIVATED
        - FORBIDDEN
        - NOT_FOUND
        - DUPLICATE_SKU
        - DUPLICATE_BARCODE
        - DUPLICATE_EMAIL
        - INSUFFICIENT_STOCK
        - STALE_WRITE
        - LAST_ADMIN
        - PRODUCT_ARCHIVED
        - PRODUCT_NOT_EMPTY
        - PRODUCT_HAS_HISTORY
        - CATEGORY_IN_USE
        - INVALID_BARCODE
        - IDEMPOTENCY_CONFLICT
        - ACCOUNT_LOCKED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE

    ValidationErrorDetail:
      type: object
      description: VALIDATION_ERROR uses details = array of these (05 §6.1).
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    ErrorEnvelope:
      type: object
      description: The single error envelope every non-2xx JSON response uses (SRS §16.2, 05 §6.1).
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Human-readable; the frontend maps code → message via its own table (05 §6.2).
            details:
              description: Optional, code-specific payload (e.g. available/requested for INSUFFICIENT_STOCK).
            correlationId:
              type: string
              description: Echoes X-Correlation-Id — surfaced in error toasts (NFR-23).

    PaginationMeta:
      type: object
      description: >-
        List-envelope metadata (05 §5, FR-SRCH-03). Every list endpoint returns
        { data: [...], ...PaginationMeta }; data item types are per-endpoint.
      required: [page, limit, totalItems, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    Role:
      type: string
      description: The two operator roles (SRS §5 matrix).
      enum: [ADMIN, STAFF]

    LoginRequest:
      type: object
      description: 05 §15.1 — non-empty password only; policy never applied at login (AAD §2).
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1

    ResetPasswordRequest:
      type: object
      description: 05 §15.7 — BR-32 policy applies to newPassword.
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 10
          maxLength: 64

    ChangePasswordRequest:
      type: object
      description: 05 §15.7 — new ≠ current; BR-32 policy on newPassword.
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 10
          maxLength: 64

    UserCreateRequest:
      type: object
      description: 05 §15.6 — temporary password per BR-32; mustChangePassword is server-set.
      required: [name, email, role, temporaryPassword]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/Role'
        temporaryPassword:
          type: string
          minLength: 10
          maxLength: 64

    UserUpdateRequest:
      type: object
      description: Any of name/role/isActive — nothing else (05 §15.6). At least one required.
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        role:
          $ref: '#/components/schemas/Role'
        isActive:
          type: boolean

    User:
      type: object
      description: Admin-facing user row (05 §7.2) — never carries credential fields (SEC-02).
      required: [id, name, email, role, isActive, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        isActive:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
          description: Absent when the user has never logged in (optional-sparse rule, 05 §2).
        createdAt:
          type: string
          format: date-time

    OwnProfile:
      type: object
      description: GET/PATCH /users/me shape (05 §7.2).
      required: [id, name, email, role, mustChangePassword]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        mustChangePassword:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time

    ResetLinkResponse:
      type: object
      description: Out-of-band reset link (AS-6) — the operator delivers it themselves.
      required: [resetLink, expiresAt]
      properties:
        resetLink:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time

    CategoryWriteRequest:
      type: object
      description: >-
        05 §15.3 — POST and PATCH share this shape. name 2–60, unique
        case-insensitive (BR-26); description optional, ≤ 300 (blank → absent).
        isSystem is server-set and never accepted here (BR-28).
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
        description:
          type: string
          maxLength: 300

    Category:
      type: object
      description: Category row (05 §7.4). productCount present only on ?withCounts=true.
      required: [id, name, isSystem]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          description: Absent when unset (optional-sparse rule, 05 §2).
        isSystem:
          type: boolean
          description: true only for Uncategorized — undeletable and unmodifiable (BR-28).
        productCount:
          type: integer
          minimum: 0
          description: Products (active + archived) referencing this category; only on ?withCounts=true (§9.9).

    UploadSignatureRequest:
      type: object
      description: 05 §7.9 — declares the intended upload so the server can reject disallowed type/size before signing (BR-36).
      required: [contentType, size]
      properties:
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        size:
          type: integer
          minimum: 1
          maximum: 5242880
          description: Bytes; ≤ 5 MB.

    UploadSignatureResponse:
      type: object
      description: Signed params for a direct browser upload to Cloudinary.
      required: [signature, timestamp, apiKey, cloudName, folder]
      properties:
        signature:
          type: string
        timestamp:
          type: integer
        apiKey:
          type: string
        cloudName:
          type: string
        folder:
          type: string
          example: ims/prod

    StockStatus:
      type: string
      description: Derived from quantity vs lowStockThreshold (05 §2) — never stored.
      enum: [IN_STOCK, LOW_STOCK, OUT_OF_STOCK]

    Money:
      type: string
      description: Decimal amount as a 2-dp string (DBR-05) — never a float on the wire.
      example: '12.50'

    ProductSupplier:
      type: object
      description: Embedded supplier value object (DBD §2.3).
      required: [name]
      properties:
        name:
          type: string
          maxLength: 120
        contactName:
          type: string
          maxLength: 80
        phone:
          type: string
          maxLength: 30
        email:
          type: string
          maxLength: 254

    ProductImage:
      type: object
      description: Cloudinary image reference (DBR-03 — exactly one primary when non-empty). Managed by F5's pipeline.
      required: [publicId, url, isPrimary]
      properties:
        publicId:
          type: string
        url:
          type: string
          format: uri
        isPrimary:
          type: boolean

    ProductCreateRequest:
      type: object
      description: >-
        05 §15.4 create. SKU optional (blank → auto BR-04). quantity is not
        accepted — `initialQuantity` seeds the ledger (BR-17). Money as strings.
      required: [name, categoryId, costPrice, sellingPrice]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        sku:
          type: string
          pattern: '^[A-Za-z0-9-]{3,32}$'
          description: Optional; normalized to uppercase. Blank/omitted → auto-generated.
        barcode:
          type: string
          maxLength: 64
        categoryId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        description:
          type: string
          maxLength: 2000
        costPrice:
          $ref: '#/components/schemas/Money'
        sellingPrice:
          $ref: '#/components/schemas/Money'
        initialQuantity:
          type: integer
          minimum: 0
          default: 0
        lowStockThreshold:
          type: integer
          minimum: 0
          description: Absent → copied from Settings.defaultLowStockThreshold (DN-3).
        supplier:
          $ref: '#/components/schemas/ProductSupplier'
        images:
          type: array
          maxItems: 5
          description: ≤ 5; exactly one primary when non-empty (DBR-03). publicIds must be from an F5 upload.
          items:
            $ref: '#/components/schemas/ProductImage'

    ProductUpdateRequest:
      type: object
      description: >-
        05 §15.4 update. MUST carry `version` (BR-24). Excludes sku (immutable,
        BR-03), quantity (BR-17), isArchived (lifecycle routes). At least one
        updatable field beyond version.
      required: [version]
      properties:
        version:
          type: integer
          minimum: 0
        name:
          type: string
          minLength: 2
          maxLength: 120
        barcode:
          type: string
          maxLength: 64
        categoryId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        description:
          type: string
          maxLength: 2000
        costPrice:
          $ref: '#/components/schemas/Money'
        sellingPrice:
          $ref: '#/components/schemas/Money'
        lowStockThreshold:
          type: integer
          minimum: 0
        supplier:
          $ref: '#/components/schemas/ProductSupplier'
        images:
          type: array
          maxItems: 5
          description: Replaces the whole set; removed publicIds are destroyed post-commit (BR-38).
          items:
            $ref: '#/components/schemas/ProductImage'

    Product:
      type: object
      description: Full product (GET /products/:id · POST 201 · PATCH 200). Money as 2-dp strings.
      required:
        - id
        - name
        - sku
        - categoryId
        - quantity
        - lowStockThreshold
        - costPrice
        - sellingPrice
        - stockStatus
        - images
        - isArchived
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        sku:
          type: string
        barcode:
          type: string
        description:
          type: string
        categoryId:
          type: string
        categoryName:
          type: string
          description: Resolved category name (present when the server joined it).
        quantity:
          type: integer
          minimum: 0
        lowStockThreshold:
          type: integer
          minimum: 0
        costPrice:
          $ref: '#/components/schemas/Money'
        sellingPrice:
          $ref: '#/components/schemas/Money'
        stockStatus:
          $ref: '#/components/schemas/StockStatus'
        supplier:
          $ref: '#/components/schemas/ProductSupplier'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        isArchived:
          type: boolean
        version:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProductRow:
      type: object
      description: List row projection (GET /products) — no image array / no version (NFR-05).
      required:
        - id
        - name
        - sku
        - quantity
        - lowStockThreshold
        - stockStatus
        - costPrice
        - sellingPrice
        - isArchived
      properties:
        id:
          type: string
        name:
          type: string
        sku:
          type: string
        barcode:
          type: string
        thumbnailUrl:
          type: string
          format: uri
          description: Primary image URL, when present.
        categoryName:
          type: string
        quantity:
          type: integer
          minimum: 0
        lowStockThreshold:
          type: integer
          minimum: 0
        stockStatus:
          $ref: '#/components/schemas/StockStatus'
        costPrice:
          $ref: '#/components/schemas/Money'
        sellingPrice:
          $ref: '#/components/schemas/Money'
        isArchived:
          type: boolean

    ProductLookup:
      type: object
      description: Scanner-facing lookup result (GET /products/lookup, BR-06/07).
      required: [id, name, sku, quantity, stockStatus, isArchived]
      properties:
        id:
          type: string
        name:
          type: string
        sku:
          type: string
        barcode:
          type: string
        primaryImageUrl:
          type: string
          format: uri
        quantity:
          type: integer
          minimum: 0
        stockStatus:
          $ref: '#/components/schemas/StockStatus'
        isArchived:
          type: boolean

    SettingsUpdateRequest:
      type: object
      description: 05 §15.8 — full-object PUT; all three fields required (VAL §3.5).
      required: [currency, defaultLowStockThreshold, movementWarningThreshold]
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 code (3 uppercase letters).
        defaultLowStockThreshold:
          type: integer
          minimum: 0
          maximum: 10000000
        movementWarningThreshold:
          type: integer
          minimum: 1
          maximum: 100000

    Settings:
      type: object
      description: The settings singleton (05 §7.10). Stored field names — `currency`, not the session `systemCurrency` alias.
      required: [currency, defaultLowStockThreshold, movementWarningThreshold, updatedAt]
      properties:
        currency:
          type: string
        defaultLowStockThreshold:
          type: integer
          minimum: 0
        movementWarningThreshold:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time

    SessionUser:
      type: object
      description: The 05 §7.1 session user block — never carries credential fields (SEC-02).
      required: [id, name, email, role, mustChangePassword]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        mustChangePassword:
          type: boolean

    SessionSettings:
      type: object
      description: >-
        FCM-01 (RATIFIED 2026-07-23): read-only display constants in the
        session payload — Staff has no other approved endpoint for them
        (GET /settings stays Admin-only). Additive, EXT-01-compliant;
        exposes no settings management. AAD §12 · SMA §5.
      required: [systemCurrency, movementWarningThreshold]
      properties:
        systemCurrency:
          type: string
          description: ISO 4217 code — feeds lib/formatters.
        movementWarningThreshold:
          type: integer
          minimum: 1
          description: Large-movement confirm threshold (BR-15) for the movement dialogs.

    SessionResponse:
      type: object
      description: Login/refresh 200 — access token + profile + FCM-01 display constants.
      required: [accessToken, user, settings]
      properties:
        accessToken:
          type: string
          description: JWT HS256, 15-min TTL, payload sub/role/iat/exp only (SEC-01).
        user:
          $ref: '#/components/schemas/SessionUser'
        settings:
          $ref: '#/components/schemas/SessionSettings'

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ReadyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]

    MovementRequest:
      description: >-
        POST /inventory/movements body (§3.4), discriminated on `type`.
        STOCK_IN/STOCK_OUT carry `quantity`; ADJUSTMENT carries `delta` XOR
        `countedQuantity` plus a `reason` (note required for OTHER). INITIAL is
        server-only and rejected here.
      oneOf:
        - $ref: '#/components/schemas/StockInOutRequest'
        - $ref: '#/components/schemas/AdjustmentRequest'
      discriminator:
        propertyName: type
        mapping:
          STOCK_IN: '#/components/schemas/StockInOutRequest'
          STOCK_OUT: '#/components/schemas/StockInOutRequest'
          ADJUSTMENT: '#/components/schemas/AdjustmentRequest'

    StockInOutRequest:
      type: object
      required: [type, productId, quantity]
      properties:
        type:
          type: string
          enum: [STOCK_IN, STOCK_OUT]
        productId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
          description: Positive movement quantity (BR-12); direction derives from type.
        note:
          type: string
          maxLength: 500

    AdjustmentRequest:
      type: object
      required: [type, productId, reason]
      description: Admin-only. Exactly one of delta / countedQuantity (BR-13).
      properties:
        type:
          type: string
          enum: [ADJUSTMENT]
        productId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        delta:
          type: integer
          minimum: -100000
          maximum: 100000
          description: Signed, ≠ 0. Mutually exclusive with countedQuantity.
        countedQuantity:
          type: integer
          minimum: 0
          maximum: 10000000
          description: Absolute counted stock; the server derives the delta. Mutually exclusive with delta.
        reason:
          type: string
          enum: [DAMAGED, LOST, FOUND, COUNT_CORRECTION, RETURN, OTHER]
        note:
          type: string
          maxLength: 500
          description: Required when reason is OTHER.

    MovementTransaction:
      type: object
      required: [id, productId, type, quantityChange, quantityAfter, userId, createdAt]
      properties:
        id:
          type: string
        productId:
          type: string
        type:
          type: string
          enum: [INITIAL, STOCK_IN, STOCK_OUT, ADJUSTMENT]
        quantityChange:
          type: integer
          description: Signed net change (BR-12).
        quantityAfter:
          type: integer
          minimum: 0
        userId:
          type: string
        reason:
          type: string
          enum: [DAMAGED, LOST, FOUND, COUNT_CORRECTION, RETURN, OTHER]
        note:
          type: string
        createdAt:
          type: string
          format: date-time

    TransactionRow:
      type: object
      description: A stock-ledger row with resolved product + user labels (05 §7.6, F7).
      required:
        [
          id,
          createdAt,
          productId,
          productName,
          productSku,
          productArchived,
          type,
          quantityChange,
          quantityAfter,
          userId,
          userName,
        ]
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        productId:
          type: string
        productName:
          type: string
        productSku:
          type: string
        productArchived:
          type: boolean
        type:
          type: string
          enum: [INITIAL, STOCK_IN, STOCK_OUT, ADJUSTMENT]
        quantityChange:
          type: integer
        quantityAfter:
          type: integer
          minimum: 0
        userId:
          type: string
        userName:
          type: string
        reason:
          type: string
          enum: [DAMAGED, LOST, FOUND, COUNT_CORRECTION, RETURN, OTHER]
        note:
          type: string

    AuditLogRow:
      type: object
      description: An audit-trail row — entity diff or security event (05 §7.6, F7).
      required: [id, actorId, actorName, entityType, entityLabel, action, createdAt]
      properties:
        id:
          type: string
        actorId:
          type: string
        actorName:
          type: string
        entityType:
          type: string
          enum: [PRODUCT, CATEGORY, USER, SETTINGS, SECURITY]
        entityId:
          type: string
        entityLabel:
          type: string
          description: Display identity captured at write time (DN-4) — renders after hard deletes.
        action:
          type: string
          enum:
            [
              CREATE,
              UPDATE,
              ARCHIVE,
              RESTORE,
              DELETE,
              LOGIN_SUCCESS,
              LOGIN_FAILED,
              LOCKOUT,
              PASSWORD_RESET_ISSUED,
              PASSWORD_RESET_COMPLETED,
              PASSWORD_CHANGED,
              ROLE_CHANGE,
              DEACTIVATE,
              REACTIVATE,
              TOKEN_REUSE_DETECTED,
              REPEATED_FORBIDDEN,
            ]
        changes:
          type: array
          items:
            type: object
            required: [field]
            properties:
              field:
                type: string
              before: {}
              after: {}
        ip:
          type: string
        createdAt:
          type: string
          format: date-time

    DashboardAlertItem:
      type: object
      description: A low/out-of-stock preview entry linking to the product + pre-filled Stock In (FR-DASH-04).
      required: [id, name, sku, quantity, lowStockThreshold]
      properties:
        id:
          type: string
        name:
          type: string
        sku:
          type: string
        quantity:
          type: integer
          minimum: 0
        lowStockThreshold:
          type: integer
          minimum: 0

    MovementTrendPoint:
      type: object
      description: One UTC day of the stock-movement trend series — in vs out (FR-DASH-02).
      required: [date, in, out]
      properties:
        date:
          type: string
          description: UTC day key (YYYY-MM-DD).
        in:
          type: integer
          minimum: 0
        out:
          type: integer
          minimum: 0

    TransactionVolumePoint:
      type: object
      description: One UTC day of transaction volume (FR-DASH-02).
      required: [date, count]
      properties:
        date:
          type: string
          description: UTC day key (YYYY-MM-DD).
        count:
          type: integer
          minimum: 0

    DashboardSummary:
      type: object
      description: The single cached dashboard aggregate (05 §7.7, FR-DASH-01…04).
      required: [asOf, totals, lowStock, outOfStock, recentTransactions, charts]
      properties:
        asOf:
          type: string
          format: date-time
          description: When the served snapshot was computed (may lag by ≤ TTL under cache, BR-25).
        totals:
          type: object
          required: [activeProducts, inventoryValue, unitsInStock]
          properties:
            activeProducts:
              type: integer
              minimum: 0
            inventoryValue:
              $ref: '#/components/schemas/Money'
            unitsInStock:
              type: integer
              minimum: 0
        lowStock:
          type: object
          required: [count, items]
          properties:
            count:
              type: integer
              minimum: 0
            items:
              type: array
              items:
                $ref: '#/components/schemas/DashboardAlertItem'
        outOfStock:
          type: object
          required: [count, items]
          properties:
            count:
              type: integer
              minimum: 0
            items:
              type: array
              items:
                $ref: '#/components/schemas/DashboardAlertItem'
        recentTransactions:
          type: array
          description: The 10 most recent ledger rows (identical shape to GET /transactions).
          items:
            $ref: '#/components/schemas/TransactionRow'
        charts:
          type: object
          required: [movementTrend, transactionVolume]
          properties:
            movementTrend:
              type: array
              items:
                $ref: '#/components/schemas/MovementTrendPoint'
            transactionVolume:
              type: array
              items:
                $ref: '#/components/schemas/TransactionVolumePoint'

    InventoryReportRow:
      type: object
      description: One row of the Inventory Summary report (FR-RPT-01) — line value at current cost.
      required: [id, sku, name, categoryName, quantity, costPrice, lineValue, stockStatus]
      properties:
        id:
          type: string
        sku:
          type: string
        name:
          type: string
        categoryName:
          type: string
        quantity:
          type: integer
          minimum: 0
        costPrice:
          $ref: '#/components/schemas/Money'
        lineValue:
          $ref: '#/components/schemas/Money'
        stockStatus:
          $ref: '#/components/schemas/StockStatus'

    InventoryReport:
      allOf:
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          required: [data, totals]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/InventoryReportRow'
            totals:
              type: object
              required: [totalQuantity, totalValue]
              properties:
                totalQuantity:
                  type: integer
                  minimum: 0
                totalValue:
                  $ref: '#/components/schemas/Money'

    LowStockReportRow:
      type: object
      description: One row of the Low Stock report (FR-RPT-02) — threshold, quantity, shortage.
      required: [id, sku, name, categoryName, quantity, lowStockThreshold, shortage]
      properties:
        id:
          type: string
        sku:
          type: string
        name:
          type: string
        categoryName:
          type: string
        quantity:
          type: integer
          minimum: 0
        lowStockThreshold:
          type: integer
          minimum: 0
        shortage:
          type: integer
          minimum: 0

    ProductPerformanceRow:
      type: object
      description: One row of the Product Performance report (FR-RPT-04) — in/out/net over the range.
      required: [productId, productSku, productName, in, out, net]
      properties:
        productId:
          type: string
        productSku:
          type: string
        productName:
          type: string
        in:
          type: integer
          minimum: 0
        out:
          type: integer
          minimum: 0
        net:
          type: integer

    ProductPerformanceReport:
      allOf:
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          required: [data, totals]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ProductPerformanceRow'
            totals:
              type: object
              required: [totalIn, totalOut, totalNet]
              properties:
                totalIn:
                  type: integer
                  minimum: 0
                totalOut:
                  type: integer
                  minimum: 0
                totalNet:
                  type: integer

    ConsistencyRow:
      type: object
      description: One row of the Ledger Consistency report (FR-RPT-05) — ledger sum vs quantity.
      required: [productId, productSku, productName, ledgerSum, quantity, drift]
      properties:
        productId:
          type: string
        productSku:
          type: string
        productName:
          type: string
        ledgerSum:
          type: integer
        quantity:
          type: integer
          minimum: 0
        drift:
          type: boolean

    MovementResponse:
      type: object
      description: The committed/replayed movement plus the resulting product state (05 §7.5).
      required: [transaction, product]
      properties:
        transaction:
          $ref: '#/components/schemas/MovementTransaction'
        product:
          type: object
          required: [id, quantity, lowStockThreshold, stockStatus]
          properties:
            id:
              type: string
            quantity:
              type: integer
              minimum: 0
            lowStockThreshold:
              type: integer
              minimum: 0
            stockStatus:
              $ref: '#/components/schemas/StockStatus'
